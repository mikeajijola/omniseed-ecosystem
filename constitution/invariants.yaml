version: 1
invariants:
  - id: ARCH-001
    principle: GOVERNANCE_IS_NOT_RUNTIME
    description: Dependency direction remains Omniform to OmniSeed to OmniSeed OS, and no product depends on the governance repository.
    severity: critical
    scope: [omniform, omniseed, omniseedos]
    deterministic: true
    test: dependency-direction
    remediation: Remove the reverse or governance runtime dependency and use the owning package contract.
    owner: omniseed-ecosystem
  - id: FORM-001
    principle: STATE_SEPARATION
    description: Omniform contains no runtime Provider status.
    severity: critical
    scope: [omniform]
    deterministic: true
    test: omniform-no-runtime-provider-status
    remediation: Store live Provider status in OmniSeed runtime state.
    owner: omniform
  - id: FORM-002
    principle: PORTABLE_SEMANTICS_ONLY
    description: Omniform contains no credentials or Provider SDK dependency.
    severity: critical
    scope: [omniform]
    deterministic: true
    test: omniform-no-credentials-or-provider-sdk
    remediation: Move credentials to runtime configuration and Provider code to an adapter package.
    owner: omniform
  - id: FORM-003
    principle: PORTABLE_SEMANTICS_ONLY
    description: Omniform contains no UI-specific state.
    severity: high
    scope: [omniform]
    deterministic: true
    test: omniform-no-ui-state
    remediation: Move navigation, layout, and view state to OmniSeed OS.
    owner: omniform
  - id: FORM-004
    principle: STATE_SEPARATION
    description: Desired, deployed, observed, and evidence records are not collapsed.
    severity: critical
    scope: [omniform, omniseed]
    deterministic: true
    test: state-record-separation
    remediation: Restore separate declaration, deployment, observation, and evidence records.
    owner: omniseed
  - id: FORM-005
    principle: PORTABLE_SEMANTICS_ONLY
    description: Schema additions require explicit portability justification.
    severity: high
    scope: [omniform]
    deterministic: false
    test: semantic-portability-review
    remediation: Test the idea across unrelated domains or keep it in Provider or resource spec.
    owner: omniform
  - id: PRIM-001
    principle: PORTABLE_SEMANTICS_ONLY
    description: New desired declarations and Provider manifests use exactly the canonical primitive-family vocabulary; systems and company_search are rejected rather than silently remapped.
    severity: critical
    scope: [omniform, githubProvider]
    deterministic: true
    test: canonical-primitive-vocabulary
    remediation: Use agents, skills, connectors, workflows, schedules, policies, observations, memory, identity, or machines and document manual migration of obsolete families.
    owner: omniseed-ecosystem
  - id: PRIM-002
    principle: PROVIDER_TRUTH
    description: A Provider advertises only primitive families whose semantic responsibility its plan, apply, observe, evidence, state, and drift behavior truthfully realise.
    severity: critical
    scope: [githubProvider]
    deterministic: false
    test: provider-family-semantic-review
    remediation: Remove unproven family claims and keep the Provider narrow until implementation evidence exists.
    owner: omniseed-provider-github
  - id: PRIM-003
    principle: STATE_SEPARATION
    description: Persistence alone does not justify primitive status; concrete external objects remain deployed and observed state associated with a real primitive realisation.
    severity: critical
    scope: [omniform, omniseed]
    deterministic: false
    test: persistence-semantic-review
    remediation: Keep concrete identifiers and persistent external facts in Provider spec, deployed state, observations, and evidence rather than inventing a catch-all family.
    owner: omniseed
  - id: PRIM-004
    principle: PROVIDER_TRUTH
    description: A Provider package may support multiple primitive families while Provider selection remains subordinate to each primitive instance; the family map is only a default.
    severity: critical
    scope: [omniform, omniseed]
    deterministic: true
    test: independent-provider-selection
    remediation: Preserve family defaults and resource-level Provider selection so different primitive instances in one family can use different supplying organisations.
    owner: omniform
  - id: AGENT-003
    principle: CAPABILITY_PRIMARY
    description: Agent means governed agency, not AI; people, AI systems, software, services, teams, organisations, or other governed actors may realise an agents requirement.
    severity: high
    scope: [omniform, omniseed]
    deterministic: false
    test: actor-neutral-agency-review
    remediation: Keep implementation actor types in resource spec and do not add human- or AI-specific primitive families.
    owner: omniform
  - id: CAP-001
    principle: CAPABILITY_PRIMARY
    description: Domain-level and company-level abilities are modelled as Capabilities composed from primitive requirements rather than promoted into primitive families.
    severity: high
    scope: [omniform, omniseed]
    deterministic: false
    test: capability-versus-primitive-review
    remediation: Model the company ability as a Capability and declare only the fundamental manifestation requirements selected by its strategy.
    owner: omniform
  - id: CAP-002
    principle: CAPABILITY_PRIMARY
    description: A Capability is not silently reduced to one implementation primitive; company_search is not memory or skills, software development is not workflows, and customer support is not agents.
    severity: critical
    scope: [omniform, omniseed]
    deterministic: false
    test: capability-reduction-review
    remediation: Preserve the Capability identity and resolve its declared family-specific Provider participants without a universal family alias.
    owner: omniseed
  - id: CAP-003
    principle: CAPABILITY_PRIMARY
    description: Company Search is an ordinary company_search Capability with a governed search_company operation whose Provider participants come from the declared capability strategy.
    severity: critical
    scope: [omniform, omniseed]
    deterministic: true
    test: company-search-capability-boundary
    remediation: Remove hard-coded memory/skills Provider selection and resolve search participants from the operation's Capability requirements and Provider dependencies.
    owner: omniseed
  - id: COMPANY-001
    principle: STATE_SEPARATION
    description: Every production company names one PR-governed canonical Git desired-state authority, distinct from runtime observations and reusable product repositories.
    severity: critical
    scope: [company, omniform, omniseed]
    deterministic: true
    test: canonical-company-git-authority
    remediation: Declare the canonical HTTPS Git repository, merged branch, Omniform path, and pull_request change mode and remove runtime canonical-definition mutation.
    owner: omniseed-ecosystem-company
  - id: COMPANY-002
    principle: CAPABILITY_PRIMARY
    description: Named realisations trace Capability requirements through primitive resources and independently selected family Providers.
    severity: critical
    scope: [company, omniform, omniseed]
    deterministic: true
    test: explainable-realisation-chain
    remediation: Reference a named realisation whose primitive participants supply declared requirements and compile Provider, observation, and evidence trace data.
    owner: omniseed
  - id: COMPANY-003
    principle: INTERFACE_NEUTRALITY
    description: Company Stewardship exists independently of Lily, and the declared steward uses ordinary governed OmniSeed operations without self-escalation.
    severity: critical
    scope: [company, omniseedos]
    deterministic: true
    test: replaceable-governed-steward
    remediation: Declare stewardship as a Capability and named realisation with a replaceable agents participant; route reads and proposals through engine operations.
    owner: omniseedos
  - id: COMPANY-004
    principle: INTERFACE_NEUTRALITY
    description: OmniSeed OS is an optional human-interface realisation discovered from company state and never defines company identity.
    severity: critical
    scope: [company, omniseedos]
    deterministic: true
    test: optional-os-realisation
    remediation: Model the OS under an operating Capability and make the UI project instance and steward binding from OmniSeed inspection.
    owner: omniseedos
  - id: COMPANY-005
    principle: CAPABILITY_PRIMARY
    description: Production reconciliation is an ordinary company Capability realised through primitive composition and the governed plan, approval, apply, observation, and evidence operations; bootstrap receives no privileged lifecycle.
    severity: critical
    scope: [company, omniseed]
    deterministic: true
    test: ordinary-reconciliation-capability
    remediation: Declare a reconciliation Capability and named Realisation using canonical primitive families, and expose only ordinary governed OmniSeed operations to its actors and interfaces.
    owner: omniseed-ecosystem-company
  - id: ENGINE-001
    principle: DETERMINISTIC_MUTATION
    description: Controlled mutation routes through plan, approve, and apply.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: controlled-mutation-path
    remediation: Route the mutation through the engine lifecycle.
    owner: omniseed
  - id: ENGINE-002
    principle: DETERMINISTIC_MUTATION
    description: Apply requires an exact persisted plan.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: exact-persisted-plan
    remediation: Load and verify the reviewed stored plan before apply.
    owner: omniseed
  - id: ENGINE-003
    principle: DETERMINISTIC_MUTATION
    description: Declaration or state drift invalidates a reviewed plan.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: stale-plan-protection
    remediation: Bind plans to declaration hash and state version.
    owner: omniseed
  - id: ENGINE-004
    principle: PROVIDER_TRUTH
    description: Provider implementations are explicitly registered.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: explicit-provider-registration
    remediation: Require registration and never construct a desired Provider implicitly.
    owner: omniseed
  - id: ENGINE-005
    principle: PROVIDER_TRUTH
    description: Missing Providers remain truthful gaps.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: missing-provider-gap
    remediation: Expose the gap instead of fabricating or silently selecting a fallback.
    owner: omniseed
  - id: ENGINE-006
    principle: PROVIDER_TRUTH
    description: Vendor SDKs do not become engine core dependencies.
    severity: high
    scope: [omniseed]
    deterministic: true
    test: engine-no-vendor-sdk
    remediation: Move vendor integration behind a Provider package or adapter.
    owner: omniseed
  - id: ENGINE-007
    principle: EVIDENCE_BEFORE_CLAIMS
    description: Evidence and observations retain provenance.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: evidence-provenance
    remediation: Record the source, Provider, resource, and observation time where applicable.
    owner: omniseed
  - id: ENGINE-008
    principle: PROVIDER_TRUTH
    description: OmniSeed's Provider execution boundary does not require implementations to run inside the Node.js process.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: language-independent-provider-boundary
    remediation: Restore the normalized Provider handle and transport-neutral protocol boundary without branching engine lifecycle code by language.
    owner: omniseed
  - id: ENGINE-009
    principle: DETERMINISTIC_MUTATION
    description: A reference Provider implemented outside JavaScript passes the real governed Provider lifecycle test.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: external-provider-lifecycle
    remediation: Restore the external reference Provider and its inspect, plan, approve, apply, observe, persist, recompile, and reconcile test.
    owner: omniseed
  - id: ENGINE-010
    principle: DETERMINISTIC_MUTATION
    description: Company definition changes remain exact persisted proposals with separate authority, approval, validation, and stale-definition protection.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: governed-company-change
    remediation: Restore proposal hashing, evidence provenance, candidate Omniform validation, exact approval, and company_change_stale rejection before canonical definition mutation.
    owner: omniseed
  - id: OS-001
    principle: INTERFACE_NEUTRALITY
    description: OmniSeed OS does not independently calculate authoritative capability status.
    severity: critical
    scope: [omniseedos]
    deterministic: true
    test: os-authority-boundary
    remediation: Render the state returned by OmniSeed inspection.
    owner: omniseedos
  - id: OS-002
    principle: DETERMINISTIC_MUTATION
    description: OmniSeed OS does not independently authorize engine mutations.
    severity: critical
    scope: [omniseedos]
    deterministic: true
    test: os-mutation-delegation
    remediation: Forward the request and authorization to an OmniSeed operation.
    owner: omniseedos
  - id: OS-003
    principle: INTERFACE_NEUTRALITY
    description: OmniSeed OS actions resolve to engine operation IDs.
    severity: high
    scope: [omniseedos]
    deterministic: true
    test: os-operation-identity
    remediation: Project registered engine operations instead of inventing OS-only actions.
    owner: omniseedos
  - id: CLIENT-001
    principle: INTERFACE_NEUTRALITY
    description: Equivalent actor permissions produce consistent operation availability across clients.
    severity: high
    scope: [omniseed, omniseedos]
    deterministic: false
    test: cross-client-operation-parity
    remediation: Resolve availability once in OmniSeed and translate only presentation in clients.
    owner: omniseed
  - id: AGENT-001
    principle: DETERMINISTIC_MUTATION
    description: Semantic agents cannot directly mutate managed resources.
    severity: critical
    scope: [omniseed, omniseedos]
    deterministic: true
    test: no-agent-provider-bypass
    remediation: Route agent requests through governed engine operations.
    owner: omniseed
  - id: AGENT-002
    principle: GOVERNED_CONTRIBUTION
    description: Agent-generated changes remain proposals until deterministic validation.
    severity: critical
    scope: [omniseed]
    deterministic: false
    test: proposal-lifecycle-review
    remediation: Store agent output as a proposal with no direct mutation authority.
    owner: omniseed
  - id: PKG-001
    principle: GOVERNANCE_IS_NOT_RUNTIME
    description: Omniform, engine, and OS package compatibility is machine checked.
    severity: high
    scope: [omniform, omniseed, omniseedos]
    deterministic: true
    test: package-compatibility
    remediation: Align package versions with compatibility/packages.yaml.
    owner: omniseed-ecosystem
  - id: DOC-001
    principle: GOVERNANCE_IS_NOT_RUNTIME
    description: Published ownership documentation matches executable dependency boundaries.
    severity: medium
    scope: [omniform, omniseed, omniseedos]
    deterministic: true
    test: ownership-documentation
    remediation: Correct the documentation or dependency boundary so they agree.
    owner: omniseed-ecosystem
  - id: ID-001
    principle: CAPABILITY_PRIMARY
    description: Authoritative objects use stable IDs rather than display names.
    severity: high
    scope: [omniform, omniseed]
    deterministic: true
    test: stable-authority-ids
    remediation: Add stable IDs and use names only for display.
    owner: omniform
  - id: EVID-001
    principle: EVIDENCE_BEFORE_CLAIMS
    description: Evidence references its source or provenance.
    severity: critical
    scope: [omniseed]
    deterministic: true
    test: evidence-provenance
    remediation: Attach inspectable source and provenance data to evidence.
    owner: omniseed
  - id: EVID-002
    principle: EVIDENCE_BEFORE_CLAIMS
    description: Historical evidence is not silently rewritten.
    severity: critical
    scope: [omniseed]
    deterministic: false
    test: append-only-evidence-review
    remediation: Append corrected or superseding evidence while retaining history.
    owner: omniseed
  - id: PROVIDER-001
    principle: PROVIDER_TRUTH
    description: The GitHub Provider publishes a valid static capability manifest without claiming live installation or health.
    severity: high
    scope: [githubProvider]
    deterministic: true
    test: github-provider-manifest
    remediation: Restore a schema-valid provider-package.json and referenced configuration schema whose claims match the implementation.
    owner: omniseed-provider-github
  - id: PROVIDER-002
    principle: PROVIDER_TRUTH
    description: Provider identity is the supplying organisation boundary; products, services, frameworks, SDKs, and features remain implementation choices beneath it.
    severity: critical
    scope: [omniform, omniseed, omniseedos, githubProvider]
    deterministic: false
    test: provider-organisation-semantic-review
    remediation: Declare the supplying organisation, canonical Provider ID, supported primitive families, and products used per family; replace product-shaped Provider identities with the supplying organisation boundary.
    owner: omniseed-ecosystem
  - id: PROVIDER-003
    principle: PROVIDER_TRUTH
    description: Two active Provider package manifests cannot declare the same canonical Provider ID.
    severity: critical
    scope: [provider-packages]
    deterministic: true
    test: unique-provider-manifest-id
    remediation: Consolidate primitive-family implementations beneath one Provider package manifest for the supplying organisation; product adapters without Provider manifests remain allowed.
    owner: omniseed-ecosystem
  - id: PROVIDER-004
    principle: PROVIDER_TRUTH
    description: Every active Provider manifest explicitly identifies its supplying organisation and the products used beneath each supported primitive family.
    severity: critical
    scope: [provider-packages]
    deterministic: true
    test: provider-organisation-metadata
    remediation: Add organisation and per-family product metadata, ensure every supported family has exactly one implementation entry, and submit the supplying boundary for semantic review.
    owner: omniseed-ecosystem
