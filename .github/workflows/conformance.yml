name: Ecosystem conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance repository
        uses: actions/checkout@v7
        with:
          path: omniseed-ecosystem
      - name: Check out Omniform
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniform
          ref: main
          path: omniform
      - name: Check out OmniSeed
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed
          ref: main
          path: omniseed
      - name: Check out OmniSeed OS
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseedos
          ref: main
          path: omniseedos
      - name: Check out GitHub Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-provider-github
          ref: 84318045e5c614f8674120e5996c535d2f8262c0
          path: omniseed-provider-github
      - name: Check out Vercel Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-provider-vercel
          ref: 6a65f743db11b72fb95c612766b69813ea33c0da
          path: omniseed-provider-vercel
      - name: Check out Neon Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-provider-neon
          ref: b8cc57f9411d0cd52732be267b75d4b1da1188f2
          path: omniseed-provider-neon
      - name: Check out OmniSeed Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-provider-omniseed
          ref: f73f8ad7f1c90268f8a60885e75d3378392a2a80
          path: omniseed-provider-omniseed
      - name: Check out Omnicede Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omnicede
          ref: 20681f2c942c8a6d3bd23b693105992a08e69c3e
          path: omnicede
      - name: Check out OmniSeed Ecosystem company
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-ecosystem-company
          path: omniseed-ecosystem-company
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omniseed-ecosystem/package-lock.json
      - name: Install governance dependencies
        run: npm ci
        working-directory: omniseed-ecosystem
      - name: Install Omniform dependencies
        run: npm ci
        working-directory: omniform
      - name: Install OmniSeed test dependencies
        run: npm ci
        working-directory: omniseed
      - name: Install OmniSeed OS test dependencies
        run: npm ci
        working-directory: omniseedos
      - name: Test
        run: npm test
        working-directory: omniseed-ecosystem
      - name: Run conformance
        run: >-
          npm run conformance --
          --omniform ../omniform
          --engine ../omniseed
          --os ../omniseedos
          --github-provider ../omniseed-provider-github
          --vercel-provider ../omniseed-provider-vercel
          --provider neon=../omniseed-provider-neon
          --provider omniseed=../omniseed-provider-omniseed
          --provider omnicede=../omnicede
          --company ../omniseed-ecosystem-company
          --output reports/latest.json
          --fail-on warning
        working-directory: omniseed-ecosystem
      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: omniseed-ecosystem/reports/latest.json
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Prepare Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/conformance
          cp reports/latest.json _site/conformance/latest.json
          cp site/conformance/index.html _site/conformance/index.html
          cp site/index.html _site/index.html
        working-directory: omniseed-ecosystem
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: omniseed-ecosystem/_site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: conformance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
