name: Ecosystem conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance repository
        uses: actions/checkout@v7
        with:
          path: omniseed-ecosystem
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omniseed-ecosystem/package-lock.json
      - name: Install governance dependencies
        run: npm ci
        working-directory: omniseed-ecosystem
      - name: Resolve and check out governed subjects
        run: node conformance/src/checkout.js
        working-directory: omniseed-ecosystem
      - name: Restore last published certification
        continue-on-error: true
        run: curl --fail --silent --show-error --max-time 30 https://mikeajijola.github.io/omniseed-ecosystem/conformance/latest.json -o "$RUNNER_TEMP/certified-conformance.json"
      - name: Install Omniform dependencies
        run: npm ci
        working-directory: omniform
      - name: Install OmniSeed test dependencies
        run: npm ci
        working-directory: omniseed
      - name: Install OmniSeed OS test dependencies
        run: npm ci
        working-directory: omniseedos
      - name: Test
        id: tests
        run: npm test
        working-directory: omniseed-ecosystem
      - name: Evaluate candidate
        id: candidate
        if: ${{ !cancelled() }}
        run: npm run conformance -- --report-kind candidate --observe-remotes --output "${{ runner.temp }}/candidate.json" --fail-on warning
        working-directory: omniseed-ecosystem
      - name: Observe mainline certification
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: npm run conformance -- --report-kind mainline --observe-remotes --certified-report "${{ runner.temp }}/certified-conformance.json" --output "${{ runner.temp }}/latest.json" --fail-on warning
        working-directory: omniseed-ecosystem
      - name: Certify exact passing mainline candidate
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.tests.outcome == 'success' && steps.candidate.outcome == 'success' }}
        run: npm run conformance -- --report-kind mainline --observe-remotes --certify-candidate "${{ runner.temp }}/candidate.json" --output "${{ runner.temp }}/latest.json" --fail-on warning
        working-directory: omniseed-ecosystem
      - name: Upload conformance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: |
            ${{ runner.temp }}/candidate.json
            ${{ runner.temp }}/latest.json
          if-no-files-found: error
      - name: Configure Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6
      - name: Prepare Pages site
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          mkdir -p _site/conformance
          cp "$RUNNER_TEMP/latest.json" _site/conformance/latest.json
          cp site/conformance/index.html _site/conformance/index.html
          cp site/index.html _site/index.html
        working-directory: omniseed-ecosystem
      - name: Upload Pages site
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: omniseed-ecosystem/_site

  deploy-pages:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: conformance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
