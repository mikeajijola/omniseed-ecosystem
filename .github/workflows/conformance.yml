name: Ecosystem conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out governance repository
        uses: actions/checkout@v7
        with:
          path: omniseed-ecosystem
      - name: Check out Omniform
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniform
          path: omniform
      - name: Check out OmniSeed
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed
          path: omniseed
      - name: Check out OmniSeed OS
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseedos
          path: omniseedos
      - name: Check out GitHub Provider
        uses: actions/checkout@v7
        with:
          repository: mikeajijola/omniseed-provider-github
          path: omniseed-provider-github
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: omniseed-ecosystem/package-lock.json
      - name: Install governance dependencies
        run: npm ci
        working-directory: omniseed-ecosystem
      - name: Install Omniform dependencies
        run: npm ci
        working-directory: omniform
      - name: Install OmniSeed test dependencies
        run: npm install --no-save --no-package-lock ../omniform
        working-directory: omniseed
      - name: Test
        run: npm test
        working-directory: omniseed-ecosystem
      - name: Run conformance
        run: >-
          npm run conformance --
          --omniform ../omniform
          --engine ../omniseed
          --os ../omniseedos
          --github-provider ../omniseed-provider-github
          --output reports/latest.json
          --fail-on warning
        working-directory: omniseed-ecosystem
      - name: Upload conformance report
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: omniseed-ecosystem/reports/latest.json
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Prepare Pages site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site/conformance
          cp reports/latest.json _site/conformance/latest.json
          cp site/conformance/index.html _site/conformance/index.html
          cp site/index.html _site/index.html
        working-directory: omniseed-ecosystem
      - name: Upload Pages site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: omniseed-ecosystem/_site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: conformance
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
