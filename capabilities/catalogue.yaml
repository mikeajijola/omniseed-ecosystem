catalogueVersion: "1.0.0"
entries:
  - { id: govern_strategy, domain: strategy_governance, name: Govern strategy, outcome: "Direction, priorities, decisions, and accountability remain explicit.", requirements: [decision_authority, strategic_review] }
  - { id: manage_products_services, domain: product_service, name: Manage products and services, outcome: "Offerings are discovered, shaped, delivered, and retired against customer outcomes.", requirements: [portfolio_decisions, lifecycle_management] }
  - { id: conduct_research_innovation, domain: research_innovation, name: Conduct research and innovation, outcome: "Uncertainty is reduced through evidence-generating research and experiments.", requirements: [research_practice, experiment_evidence] }
  - { id: engineer_products, domain: engineering, name: Engineer products, outcome: "Product changes are designed, verified, released, and maintained.", requirements: [change_delivery, quality_evidence] }
  - { id: operate_platforms, domain: platform_it, name: Operate platforms and IT, outcome: "Digital services remain available, supportable, and recoverable.", requirements: [service_operation, reliability_observation] }
  - { id: secure_company, domain: security_risk_privacy, name: Secure company operations, outcome: "Security, privacy, compliance, and enterprise risks are identified and controlled.", requirements: [risk_control, compliance_evidence] }
  - { id: manage_finance, domain: finance_accounting, name: Manage finance and accounting, outcome: "Cash, accounts, forecasts, obligations, and financial decisions are controlled.", requirements: [financial_record, financial_control] }
  - { id: administer_legal_corporate, domain: legal_corporate, name: Administer legal and corporate matters, outcome: "Legal obligations, entities, contracts, and governance records are maintained.", requirements: [legal_record, obligation_control] }
  - { id: develop_people, domain: people_learning, name: Develop people and organisation, outcome: "The company attracts, supports, develops, and retains suitable contributors.", requirements: [workforce_planning, learning_support] }
  - { id: grow_revenue, domain: sales_revenue, name: Grow revenue, outcome: "Qualified demand becomes governed, durable customer revenue.", requirements: [opportunity_management, commercial_agreement] }
  - { id: communicate_market, domain: marketing_communications, name: Communicate with the market, outcome: "Audiences can discover, understand, and trust the company and its offerings.", requirements: [audience_communication, publication_governance] }
  - { id: cultivate_ecosystem, domain: partnerships_community, name: Cultivate partnerships and community, outcome: "External relationships create mutual, governed value.", requirements: [relationship_management, community_stewardship] }
  - { id: support_customers, domain: customer_success_support, name: Onboard and support customers, outcome: "Customers adopt offerings, obtain help, and achieve intended outcomes.", requirements: [customer_onboarding, support_resolution] }
  - { id: manage_suppliers, domain: procurement_vendors, name: Manage suppliers, outcome: "External goods and services are selected, governed, and reviewed.", requirements: [supplier_selection, vendor_oversight] }
  - { id: manage_data_knowledge, domain: data_analytics_knowledge, name: Manage data and knowledge, outcome: "Trusted information is findable, interpretable, retained, and used responsibly.", requirements: [knowledge_access, data_governance] }
  - { id: assure_continuity, domain: incident_continuity, name: Assure incident response and continuity, outcome: "The company detects disruption, responds, recovers, and learns.", requirements: [incident_response, continuity_recovery] }
  - { id: operate_programmes, domain: accelerator_programmes, name: Operate programmes and accelerators, outcome: "Cohorts and programmes are selected, delivered, evaluated, and improved.", requirements: [programme_delivery, cohort_evaluation] }
